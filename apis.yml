aid: flowdesk
name: Flowdesk
description: >-
  Flowdesk is a full-service digital-asset trading and technology firm that
  delivers liquidity, execution, and market infrastructure to token issuers,
  exchanges, and institutions. It is a regulated Crypto-Asset Service Provider
  registered with France's AMF and licensed by Dubai's Virtual Assets Regulatory
  Authority (VARA). Products span liquidity solutions (token, stablecoin,
  exchange, and DeFi), OTC trading (spot, derivatives, and credit) across 150+
  venues and 1,000+ asset pairs, tokenized-market infrastructure, and ventures.
  Flowdesk exposes a developer-facing "Platform Connect" API for programmatic
  OTC spot trading over REST with a companion WebSocket streaming channel,
  authenticated with OAuth 2.0 JWT bearer tokens issued through its Auth0 tenant.
